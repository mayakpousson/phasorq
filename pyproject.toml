[project]
name = "phasorq"
version = "0.1.0"
description = "Guided quantum experiments with reproducible simulation comparisons"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qiskit>=2.1,<3",
    "qiskit-aer>=0.17,<1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
]

[project.optional-dependencies]
hardware = ["openquantum-sdk[qiskit]"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
